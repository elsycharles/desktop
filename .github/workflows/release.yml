name: Release

# Builds GitHub Desktop with Smart Split for macOS, Windows and Linux and
# publishes the installers in a GitHub release.
#
# - Automatic releases: after each update of development (and of
#   development-linux), the "Sync development-linux" workflow starts this one
#   without a tag, and a new version is released as v<version>-smartsplit.<run>.
# - Manual releases: push a v* tag, or start this workflow with a tag.
#
# macOS and Windows are built from development (or the tag), Linux from the
# development-linux branch, which contains development plus the Linux patches.
# Nothing is published unless every build and test passes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          The tag to release. Leave empty to release the current development
          branch under a new version.
        required: false
        default: ''
        type: string
      dry-run:
        description: Only build and test, without publishing anything
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      linux-sha: ${{ steps.release.outputs.linux-sha }}
      new-tag: ${{ steps.release.outputs.new-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Choose the version and commits to release
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            new_tag=false
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            new_tag=false
          else
            version=$(node -p "require('./app/package.json').version")
            tag="v${version}-smartsplit.${GITHUB_RUN_NUMBER}"
            new_tag=true
          fi

          # Build exactly these commits, even if the branches move meanwhile
          git fetch --no-tags origin development-linux
          {
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
            echo "linux-sha=$(git rev-parse FETCH_HEAD)"
            echo "new-tag=$new_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $(git rev-parse --short HEAD), Linux from $(git rev-parse --short FETCH_HEAD)"

  build:
    name: macOS & Windows
    needs: prepare
    uses: ./.github/workflows/build-desktop.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      name: ${{ needs.prepare.outputs.tag }}
      upload: true

  linux:
    name: Linux
    needs: prepare
    uses: ./.github/workflows/ci-linux.yml
    with:
      ref: ${{ needs.prepare.outputs.linux-sha }}

  publish:
    name: Publish the release
    needs: [prepare, build, linux]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
      LINUX_SHA: ${{ needs.prepare.outputs.linux-sha }}
      NEW_TAG: ${{ needs.prepare.outputs.new-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Collect installers
        run: |
          mkdir release
          cp artifacts/release-*/* release/
          for file in artifacts/Linux-*/*; do
            cp "$file" "release/$(basename "$file")"
          done
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          ls -la release
      - name: Write release notes
        run: |
          version=$(node -p "require('./app/package.json').version")
          cat > notes.md <<EOF
          GitHub Desktop ${version} with **Smart Split** (AI-powered commit splitting with Copilot).

          - macOS and Windows are built from ${SHA:0:10}
          - Linux is built from ${LINUX_SHA:0:10} (\`development-linux\`)

          ## Installation

          These builds aren't signed with GitHub's certificates and don't update
          automatically: new versions are published on this releases page.

          - **macOS**: unzip, move *GitHub Desktop* to Applications, then run
            \`xattr -dr com.apple.quarantine "/Applications/GitHub Desktop.app"\`
            once (otherwise macOS says the app is damaged).
          - **Windows**: run the \`.exe\`. SmartScreen warns about an unknown
            publisher: click *More info* → *Run anyway*.
          - **Linux**: install the \`.deb\` (Debian/Ubuntu) or \`.rpm\`
            (Fedora/openSUSE), or run the \`.AppImage\` after \`chmod +x\`.

          The SHA-256 checksums of every file are in \`SHA256SUMS.txt\`.
          EOF
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Automatic releases create their tag on the built commit
          if [ "$NEW_TAG" = "true" ]; then
            tag_option=(--target "$SHA")
          else
            tag_option=(--verify-tag)
          fi

          gh release create "$TAG" release/* \
            --title "GitHub Desktop with Smart Split ${TAG}" \
            --notes-file notes.md \
            "${tag_option[@]}"
