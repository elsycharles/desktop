name: Sync branch

# Reusable workflow merging one or more source branches into a branch of this
# repository and pushing the result. On a merge conflict nothing is pushed: the
# conflicting files are listed in the job summary and in an issue.
#
# GITHUB_TOKEN can't push commits that change files in .github/workflows, which
# upstream merges regularly do. Add a SYNC_TOKEN secret (a fine-grained personal
# access token for this repository with read and write access to "Contents" and
# "Workflows") so that these merges can be pushed too.

on:
  workflow_call:
    inputs:
      target-branch:
        description: The branch of this repository to update
        required: true
        type: string
      sources:
        description: >-
          The branches to merge, in order, one per line as "<owner>/<repository>
          <branch>"
        required: true
        type: string
    outputs:
      updated:
        description: Whether new commits were pushed to the target branch
        value: ${{ jobs.sync.outputs.updated }}
    secrets:
      SYNC_TOKEN:
        required: false

jobs:
  sync:
    name: Merge into ${{ inputs.target-branch }}
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.push.outputs.updated }}
    env:
      TARGET_BRANCH: ${{ inputs.target-branch }}
    steps:
      - name: Check out target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge source branches
        id: merge
        env:
          SOURCES: ${{ inputs.sources }}
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          echo "before=$before" >> "$GITHUB_OUTPUT"

          index=0
          while read -r repository branch; do
            if [ -z "$repository" ]; then
              continue
            fi
            index=$((index + 1))

            # Branches of this repository are fetched with the checkout
            # credentials, which also works for private repositories.
            if [ "$repository" = "$GITHUB_REPOSITORY" ]; then
              remote=origin
            else
              remote="source-$index"
              git remote add "$remote" "https://github.com/${repository}.git"
            fi

            git fetch --no-tags "$remote" "$branch"
            echo "Merging ${repository}@${branch}…"

            if ! git merge --no-edit -m "Merge ${repository}@${branch} into ${TARGET_BRANCH}" FETCH_HEAD; then
              {
                echo "source=${repository}@${branch}"
                echo "conflicts<<EOF"
                git diff --name-only --diff-filter=U
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              git merge --abort
              echo "::error::Merging ${repository}@${branch} into ${TARGET_BRANCH} conflicts, nothing was pushed."
              exit 1
            fi
          done <<< "$SOURCES"

      - name: Push
        id: push
        env:
          BEFORE: ${{ steps.merge.outputs.before }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then
            echo "Already up to date."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git push origin "HEAD:${TARGET_BRANCH}"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report merge conflicts
        if: failure() && steps.merge.outputs.source != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.merge.outputs.source }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          title="Sync conflict: ${SOURCE} → ${TARGET_BRANCH}"
          files=$(while read -r file; do echo "- \`${file}\`"; done <<< "$CONFLICTS")
          body=$(printf '%s\n\n%s\n\n%s\n%s\n\n%s\n\n%s\n' \
            "Merging \`${SOURCE}\` into \`${TARGET_BRANCH}\` conflicts, so the automatic sync stopped and nothing was pushed." \
            "Conflicting files:" \
            "$files" \
            "" \
            "Resolve the conflicts locally, push \`${TARGET_BRANCH}\`, then close this issue: the next run will pick up from there." \
            "Run: ${RUN_URL}")

          echo "## ${title}" >> "$GITHUB_STEP_SUMMARY"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"

          # Issues may be disabled (the default for forks): the summary is
          # enough in that case.
          existing=$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" \
            2>/dev/null | head -n 1 || true)

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" || true
          else
            gh issue create --title "$title" --body "$body" ||
              echo "::warning::Couldn't open an issue (are issues enabled for this repository?)"
          fi
