name: Sync development-linux

# Keeps development-linux up to date with development (upstream GitHub Desktop
# and Smart Split) and with the Linux patches of shiftkey/desktop, then
# releases the update for macOS, Windows and Linux.
#
# Scheduled workflows only run from the default branch, which is why this file
# lives on development even though it updates development-linux.

on:
  # After the nightly upstream sync
  workflow_run:
    workflows: [Sync upstream development]
    types: [completed]
  # After your own pushes to development
  push:
    branches:
      - development
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

concurrency:
  group: sync-development-linux
  cancel-in-progress: false

jobs:
  sync:
    name: Merge development and shiftkey/linux
    # After the upstream sync, only run when it succeeded
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/sync-branch.yml
    with:
      target-branch: development-linux
      sources: |
        ${{ github.repository }} development
        shiftkey/desktop linux
    secrets: inherit

  release:
    name: Release the update
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start
      # the release explicitly. It builds and tests every platform and only
      # publishes when everything passes.
      - name: Start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref
          development
