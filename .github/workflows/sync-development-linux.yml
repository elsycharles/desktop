name: Sync development-linux

# Keeps development-linux up to date with development (upstream GitHub Desktop
# and Smart Split) and with the Linux patches of shiftkey/desktop. Releases are
# started by the "Watch upstream releases" workflow.
#
# Scheduled workflows only run from the default branch, which is why this file
# lives on development even though it updates development-linux.

on:
  # After each upstream sync
  workflow_run:
    workflows: [Sync upstream development]
    types: [completed]
  # After your own pushes to development
  push:
    branches:
      - development
  # In case an upstream sync was skipped
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

concurrency:
  group: sync-development-linux
  cancel-in-progress: false

jobs:
  sync:
    name: Merge development and shiftkey/linux
    # After the upstream sync, only run when it succeeded
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/sync-branch.yml
    with:
      target-branch: development-linux
      sources: |
        ${{ github.repository }} development
        shiftkey/desktop linux
    secrets: inherit
