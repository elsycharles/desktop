name: Watch upstream releases

# Starts a release of this fork, for every platform, when desktop/desktop
# publishes a new version (betas included), tagged v<version>-smartsplit. It
# waits until the syncs have merged that version into development and
# development-linux. When development-linux is still behind 12 hours after the
# upstream release, macOS & Windows are released without waiting for it.
#
# A release that failed isn't started again before a day has passed, rather
# than every hour.
#
# It also keeps the releases page tidy (see .github/fork/tidy-releases.mjs):
# releases named after their version, betas as pre-releases, the most recent
# stable version as the latest release. Starting this workflow with "Delete
# duplicates" also deletes the releases that more recent releases of the same
# version replace.
#
# GitHub doesn't notify forks about upstream releases, so this checks hourly.

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      delete-duplicates:
        description: >-
          Also delete the releases (and their tags) that more recent releases of
          the same version replace
        required: false
        default: false
        type: boolean

concurrency:
  group: watch-upstream-releases
  cancel-in-progress: false

jobs:
  check:
    name: Check for new upstream releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0

      # A release takes about an hour: don't start the same one again
      - name: Check that no release is running
        id: idle
        run: |
          running=$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml \
            --limit 20 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          if [ "$running" != "0" ]; then
            echo "A release is already running, checking again next hour."
          fi
          echo "idle=$([ "$running" = "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Release desktop/desktop's latest version
        if: steps.idle.outputs.idle == 'true'
        run: |
          set -euo pipefail
          read -r upstream_tag published < <(gh release list -R desktop/desktop \
            --limit 1 --json tagName,publishedAt \
            --jq '.[0] | "\(.tagName) \(.publishedAt)"')
          version="${upstream_tag#release-}"
          tag="v${version}-smartsplit"
          echo "Latest desktop/desktop release: ${upstream_tag} (${published})"

          # Already released (new releases of a version add a .N suffix)
          released=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq '.[].tagName' |
            grep -E "^${tag//./\\.}(\\.[0-9]+)?$" || true)
          if [ -n "$released" ]; then
            echo "Already released as: ${released//$'\n'/, }"
            exit 0
          fi

          # A release of it that failed is tried again a day later
          failed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml \
            --limit 50 --json displayTitle,conclusion,createdAt \
            --jq "[.[] | select(.displayTitle == \"Release ${tag}\" and
              .conclusion == \"failure\" and
              (.createdAt | fromdateiso8601) > (now - 86400))] | length")
          if [ "$failed" != "0" ]; then
            echo "::warning::The release of ${tag} failed less than a day ago, see the Release workflow's runs: it's started again a day after."
            exit 0
          fi

          # Wait until the syncs have merged the release
          git fetch --no-tags https://github.com/desktop/desktop.git \
            "refs/tags/${upstream_tag}:refs/tags/upstream-${upstream_tag}"
          git fetch --no-tags origin development-linux
          if ! git merge-base --is-ancestor "upstream-${upstream_tag}" HEAD; then
            echo "development doesn't have ${upstream_tag} yet, waiting for the sync."
            exit 0
          fi

          platforms=all
          if ! git merge-base --is-ancestor "upstream-${upstream_tag}" origin/development-linux; then
            age=$(( $(date +%s) - $(date -d "$published" +%s) ))
            if [ "$age" -lt 43200 ]; then
              echo "development-linux doesn't have ${upstream_tag} yet, waiting for the sync."
              exit 0
            fi
            platforms=macos-windows
            echo "::warning::development-linux still doesn't have ${upstream_tag} 12 hours after its release: releasing macOS & Windows without Linux."
          fi

          echo "Starting the release ${tag} (${platforms})"
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref development \
            -f tag="$tag" -f platforms="$platforms" \
            -f source="desktop/desktop ${upstream_tag}"

      - name: Tidy the releases page
        if: steps.idle.outputs.idle == 'true'
        env:
          DELETE_DUPLICATES: ${{ inputs.delete-duplicates || false }}
        run: |
          if [ "$DELETE_DUPLICATES" = "true" ]; then
            node .github/fork/tidy-releases.mjs --delete-duplicates
          else
            node .github/fork/tidy-releases.mjs
          fi
