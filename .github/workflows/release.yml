name: Release

# Builds GitHub Desktop with Smart Split and publishes the installers in a
# GitHub release, one per version, for every platform:
#
# - The "Watch upstream releases" workflow starts it when desktop/desktop
#   publishes a new version, betas included.
# - Manual releases: push a v* tag, or start this workflow.
#
# macOS and Windows are built from development, Linux from development-linux
# (development plus the Linux patches of shiftkey/desktop). Releases are named
# after their version: tag v<version>-smartsplit (.2, .3… for a new release of
# the same version), title "GitHub Desktop with Smart Split <version>". Betas
# are published as pre-releases, and stable versions as the latest release.
#
# Nothing is published unless the macOS and Windows builds pass their tests. A
# Linux build that fails doesn't hold them back: the release is then published
# without Linux, and its notes say so.

run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          The tag of the release. An existing tag is built as is; a new one is
          created on the built commit. Leave empty for a new version number.
        required: false
        default: ''
        type: string
      platforms:
        description: The platforms to build and release
        required: false
        default: all
        type: choice
        options:
          - all
          - macos-windows
          - linux
      source:
        description: >-
          The upstream release this one is based on, written in the release
          notes (set by the "Watch upstream releases" workflow)
        required: false
        default: ''
        type: string
      dry-run:
        description: Only build and test, without publishing anything
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      sha: ${{ steps.release.outputs.sha }}
      linux-sha: ${{ steps.release.outputs.linux-sha }}
      target: ${{ steps.release.outputs.target }}
      new-tag: ${{ steps.release.outputs.new-tag }}
      desktop: ${{ steps.release.outputs.desktop }}
      linux: ${{ steps.release.outputs.linux }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Choose the version and commits to release
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin development development-linux

          # Which commits to build: an existing tag is built as is, otherwise
          # the current branches
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
          fi

          if [ -n "$tag" ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            new_tag=false
            sha=$(git rev-parse "$tag^{commit}")
            linux_sha=$(git rev-parse origin/development-linux)
          else
            new_tag=true
            sha=$(git rev-parse origin/development)
            linux_sha=$(git rev-parse origin/development-linux)
          fi

          desktop=false
          linux=false
          case "$PLATFORMS" in
            macos-windows) desktop=true ;;
            linux) linux=true ;;
            *) desktop=true; linux=true ;;
          esac

          # A Linux-only release is tagged on the Linux branch
          if [ "$desktop" = "true" ]; then
            target="$sha"
            version=$(git show "$sha:app/package.json" | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          else
            target="$linux_sha"
            version=$(git show "$linux_sha:app/package.json" | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          fi

          # v<version>-smartsplit, then .2, .3… for new releases of a version
          if [ -z "$tag" ]; then
            base="v${version}$([ "$PLATFORMS" = "linux" ] && echo "-linux" || echo "")-smartsplit"
            tag="$base"
            n=2
            while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
              tag="${base}.${n}"
              n=$((n + 1))
            done
          fi

          # Betas (3.7.1-beta1…) are pre-releases
          prerelease=$([[ "$version" == *-* ]] && echo true || echo false)

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "sha=$sha"
            echo "linux-sha=$linux_sha"
            echo "target=$target"
            echo "new-tag=$new_tag"
            echo "desktop=$desktop"
            echo "linux=$linux"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag ($PLATFORMS): macOS & Windows from ${sha:0:10}, Linux from ${linux_sha:0:10}"

  build:
    name: macOS & Windows
    needs: prepare
    if: needs.prepare.outputs.desktop == 'true'
    uses: ./.github/workflows/build-desktop.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      name: ${{ needs.prepare.outputs.tag }}
      upload: true

  linux:
    name: Linux
    needs: prepare
    if: needs.prepare.outputs.linux == 'true'
    uses: ./.github/workflows/ci-linux.yml
    with:
      ref: ${{ needs.prepare.outputs.linux-sha }}

  publish:
    name: Publish the release
    needs: [prepare, build, linux]
    # macOS and Windows must pass when they're built; Linux may fail, but
    # something has to be published
    if: >-
      !cancelled() && !inputs.dry-run && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.build.result == 'success' || needs.linux.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      DESKTOP_BUILT: ${{ needs.build.result == 'success' }}
      LINUX_BUILT: ${{ needs.linux.result == 'success' }}
      SHA: ${{ needs.prepare.outputs.sha }}
      LINUX_SHA: ${{ needs.prepare.outputs.linux-sha }}
      TARGET: ${{ needs.prepare.outputs.target }}
      NEW_TAG: ${{ needs.prepare.outputs.new-tag }}
      DESKTOP: ${{ needs.prepare.outputs.desktop }}
      LINUX: ${{ needs.prepare.outputs.linux }}
      SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.target }}
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Collect installers
        run: |
          shopt -s nullglob
          mkdir release
          for file in artifacts/release-*/* artifacts/Linux-*/*; do
            cp "$file" "release/$(basename "$file")"
          done
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          ls -la release
      - name: Write release notes
        run: |
          {
            echo "GitHub Desktop ${VERSION} with **Smart Split** (AI-powered commit splitting with Copilot)."
            echo
            # "desktop/desktop release-3.7.1": link to upstream's release notes
            if [[ "$SOURCE" =~ ^([^ /]+/[^ ]+)\ (.+)$ ]]; then
              repo="${BASH_REMATCH[1]}"
              upstream_tag="${BASH_REMATCH[2]}"
              echo "Based on [${repo} ${upstream_tag}](https://github.com/${repo}/releases/tag/${upstream_tag}): its release notes list what's new in GitHub Desktop."
              echo
            elif [ -n "$SOURCE" ]; then
              echo "Based on ${SOURCE}."
              echo
            fi
            if [ "$PRERELEASE" = "true" ]; then
              echo "This is a **beta**, like the version of GitHub Desktop it's based on."
              echo
            fi
            if [ "$DESKTOP_BUILT" = "true" ]; then
              echo "- macOS and Windows are built from ${SHA:0:10} (\`development\`)"
            fi
            if [ "$LINUX_BUILT" = "true" ]; then
              echo "- Linux is built from ${LINUX_SHA:0:10} (\`development-linux\`)"
            fi
            if [ "$LINUX" = "true" ] && [ "$LINUX_BUILT" != "true" ]; then
              echo
              echo "> The Linux build of this version failed, so it has no Linux installers: on Linux, keep the previous version until the next one."
            fi
            cat <<'EOF'

          ## Installation

          These builds aren't signed with GitHub's certificates and don't update
          automatically: new versions are published on this releases page.

          - **macOS**: unzip, move *GitHub Desktop* to Applications, then run
            `xattr -dr com.apple.quarantine "/Applications/GitHub Desktop.app"`
            once (otherwise macOS says the app is damaged).
          - **Windows**: run the `.exe`. SmartScreen warns about an unknown
            publisher: click *More info* → *Run anyway*.
          - **Linux**: install the `.deb` (Debian/Ubuntu) or `.rpm`
            (Fedora/openSUSE), or run the `.AppImage` after `chmod +x`.

          The SHA-256 checksums of every file are in `SHA256SUMS.txt`.
          EOF
          } > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # New tags are created on the built commit
          if [ "$NEW_TAG" = "true" ]; then
            tag_option=(--target "$TARGET")
          else
            tag_option=(--verify-tag)
          fi

          # Named after the version, with the platforms when some are missing
          title="GitHub Desktop with Smart Split ${VERSION}"
          if [ "$DESKTOP_BUILT" != "true" ]; then
            title="${title} (Linux)"
          elif [ "$LINUX_BUILT" != "true" ]; then
            title="${title} (macOS & Windows)"
          fi

          # Betas are pre-releases, stable versions the latest release
          if [ "$PRERELEASE" = "true" ]; then
            kind_option=(--prerelease)
          else
            kind_option=(--latest)
          fi

          gh release create "$TAG" release/* \
            --title "$title" \
            --notes-file notes.md \
            "${tag_option[@]}" \
            "${kind_option[@]}"
