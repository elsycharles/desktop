name: Sync branch

# Reusable workflow merging one or more source branches into a branch of this
# repository, checking the result, then pushing it.
#
# 1. Merge: each source is merged in turn. The conflicts that don't need a
#    person are resolved by .github/fork/resolve-conflicts.mjs: yarn.lock
#    files are merged by yarn, and where both sides only added lines, both
#    additions are kept.
# 2. Check: the merged code must install, pass the lint and the type check,
#    and pass the unit tests on the given runner. Git can cleanly merge code
#    that no longer works together, when upstream changes a function Smart
#    Split uses for instance: such a merge is never pushed.
# 3. Publish: the checked merge is pushed. When a person is needed instead (a
#    conflict that can't be resolved mechanically, or a failed check), it goes
#    to the sync/<branch> branch with a pull request saying what to do, and the
#    run still succeeds. An attempt is only made once: later runs try again
#    when the branch or a source changes, keep the pull request up to date
#    until someone pushes to it, and close it once it isn't needed anymore.
#
# The steps are in .github/fork/sync.mjs, taken from this workflow's commit:
# the branch being updated may not have them yet.
#
# GITHUB_TOKEN can't push commits that change files in .github/workflows, which
# upstream merges regularly do: the SYNC_TOKEN secret, a fine-grained personal
# access token for this repository with read and write access to "Contents" and
# "Workflows", is used to push. Pull requests are opened with GITHUB_TOKEN,
# which needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings, or else with SYNC_TOKEN, which then needs read
# and write access to "Pull requests" too. If neither can, the run fails once,
# with the details in its summary.

on:
  workflow_call:
    inputs:
      target-branch:
        description: The branch of this repository to update
        required: true
        type: string
      sources:
        description: >-
          The branches to merge, in order, one per line as "<owner>/<repository>
          <branch>"
        required: true
        type: string
      check-runner:
        description: The runner the merged code is checked on
        required: true
        type: string
      retry:
        description: Try again even if this same attempt was already reported
        required: false
        default: false
        type: boolean
    outputs:
      updated:
        description: Whether new commits were pushed to the target branch
        value: ${{ jobs.sync.outputs.updated }}
    secrets:
      SYNC_TOKEN:
        required: false

jobs:
  sync:
    name: Merge into ${{ inputs.target-branch }}
    runs-on: ${{ inputs.check-runner }}
    timeout-minutes: 90
    outputs:
      updated: ${{ steps.publish.outputs.updated }}
    env:
      TARGET_BRANCH: ${{ inputs.target-branch }}
      SYNC_BRANCH: sync/${{ inputs.target-branch }}
      SOURCES: ${{ inputs.sources }}
      # Like the CI: unsigned builds of this fork
      RELEASE_CHANNEL: fork
    steps:
      - name: Check out ${{ inputs.target-branch }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Get the sync scripts
        run: |
          git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null ||
            git fetch --no-tags origin "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/fork"
          git archive "$GITHUB_SHA" .github/fork | tar -x -C "$RUNNER_TEMP/fork"
          echo "FORK_SCRIPTS=$RUNNER_TEMP/fork/.github/fork" >> "$GITHUB_ENV"

      # For the scripts, and for yarn when it merges lockfiles
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Merge the source branches
        id: merge
        run: node "$FORK_SCRIPTS/sync.mjs" merge

      - name: Look for an earlier report of this attempt
        id: reported
        if: >-
          !inputs.retry && (steps.merge.outputs.merged == 'true' ||
          steps.merge.outputs.conflict == 'true')
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/sync-reported
          key: ${{ steps.merge.outputs.report-key }}
          lookup-only: true

      - name: Decide whether to check the merge
        id: plan
        env:
          MERGED: ${{ steps.merge.outputs.merged }}
          REPORTED: ${{ steps.reported.outputs.cache-hit == 'true' }}
        run: |
          echo "check=$([ "$MERGED" = true ] && [ "$REPORTED" != true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The checks: their failures don't stop the job, the publish step puts
      # them in the pull request

      - name: Install system dependencies
        if: steps.plan.outputs.check == 'true' && runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev xvfb

      - name: Read Node.js version
        id: node
        if: steps.plan.outputs.check == 'true'
        run: |
          git submodule update --init --recursive
          echo "version=$(sed 's/^v//' .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Install the dependencies
        id: install
        if: steps.plan.outputs.check == 'true'
        continue-on-error: true
        uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ steps.node.outputs.version }}
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Format the files whose conflicts were resolved
        if: >-
          steps.install.outcome == 'success' &&
          steps.merge.outputs.resolved-files != ''
        continue-on-error: true
        env:
          RESOLVED_FILES: ${{ steps.merge.outputs.resolved-files }}
        run: node "$FORK_SCRIPTS/sync.mjs" format

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: yarn lint

      - name: Type check
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: yarn tsc -p tsconfig.json --noEmit

      - name: Unit tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          yarn test:setup
          # A flaky test shouldn't hold the sync back: they get a second chance
          bash "$FORK_SCRIPTS/unit-tests.sh" || {
            echo "::warning::Some unit tests failed: running them again in case they're flaky."
            bash "$FORK_SCRIPTS/unit-tests.sh"
          }

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPORTED: ${{ steps.reported.outputs.cache-hit == 'true' }}
          CHECKS: >-
            {
              "Install the dependencies": "${{ steps.install.outcome }}",
              "Lint": "${{ steps.lint.outcome }}",
              "Type check": "${{ steps.typecheck.outcome }}",
              "Unit tests": "${{ steps.tests.outcome }}"
            }
        run: node "$FORK_SCRIPTS/sync.mjs" publish

      # A cache entry is how later runs know: see "Look for an earlier report"
      - name: Note the run that reported this attempt
        if: always() && steps.publish.outputs.remember == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/sync-reported"
          echo "$GITHUB_RUN_ID" > "$RUNNER_TEMP/sync-reported/run"

      - name: Remember that this attempt was reported
        if: always() && steps.publish.outputs.remember == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sync-reported
          key: ${{ steps.merge.outputs.report-key }}

      - name: Fail if nobody could be told
        if: steps.publish.outputs.unreported == 'true'
        run: |
          echo "::error::A person is needed to finish the sync, but no pull request could be opened: see the summary."
          exit 1
